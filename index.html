<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nginery</title>
    <meta
      name="description"
      content="nginery — Shibomo and thoughtful mobile puzzles."
    />
    <link rel="icon" href="./icon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0b1220;
        --ink-muted: #475569;
        --paper: #f4f7fb;
        --accent: #0891b2;
        --accent-deep: #0e7490;
        --line: rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        color: var(--ink);
        font-family: "Nunito Sans", sans-serif;
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .hero {
        position: relative;
        min-height: 100svh;
        display: grid;
        align-items: end;
        overflow: hidden;
        isolation: isolate;
      }

      .hero__media {
        position: absolute;
        inset: 0;
        z-index: -2;
      }

      .hero__media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        transform: scale(1.04);
        animation: drift 18s ease-in-out infinite alternate;
      }

      .hero__veil {
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(
            180deg,
            rgba(244, 247, 251, 0.18) 0%,
            rgba(244, 247, 251, 0.55) 42%,
            rgba(244, 247, 251, 0.94) 78%,
            #eef2f7 100%
          ),
          radial-gradient(
            70% 55% at 78% 18%,
            rgba(8, 145, 178, 0.18),
            transparent 70%
          );
      }

      .hero__content {
        width: min(720px, calc(100% - 2.5rem));
        margin: 0 auto;
        padding: 4.5rem 0 3.25rem;
        animation: rise 900ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .brand {
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: clamp(3.4rem, 11vw, 5.6rem);
        line-height: 0.92;
        letter-spacing: -0.03em;
        color: var(--ink);
      }

      .headline {
        margin-top: 1.15rem;
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: clamp(1.55rem, 4.4vw, 2.35rem);
        line-height: 1.15;
        letter-spacing: -0.02em;
        max-width: 14ch;
      }

      .support {
        margin-top: 0.85rem;
        max-width: 28ch;
        color: var(--ink-muted);
        font-size: clamp(1.05rem, 2.4vw, 1.2rem);
        line-height: 1.45;
        font-weight: 400;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.85rem 1.1rem;
        align-items: center;
        margin-top: 1.85rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.85rem;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-size: 0.98rem;
        letter-spacing: 0.01em;
        transition: background 180ms ease, transform 180ms ease;
      }

      .btn:hover {
        background: var(--accent-deep);
        transform: translateY(-1px);
      }

      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .link {
        color: var(--ink-muted);
        font-weight: 600;
        font-size: 0.98rem;
        border-bottom: 1px solid transparent;
        transition: color 180ms ease, border-color 180ms ease;
      }

      .link:hover {
        color: var(--ink);
        border-bottom-color: var(--line);
      }

      .product {
        display: grid;
        place-items: center;
        padding: 0 1.25rem 4.5rem;
      }

      .product__frame {
        width: min(280px, 70vw);
        aspect-ratio: 1;
        animation: float 5.5s ease-in-out infinite;
      }

      .product__frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 22%;
        box-shadow: 0 18px 40px rgba(11, 18, 32, 0.12);
      }

      .foot {
        border-top: 1px solid var(--line);
        padding: 1.35rem 1.25rem 2rem;
        text-align: center;
        color: var(--ink-muted);
        font-size: 0.92rem;
      }

      .foot a {
        color: var(--accent-deep);
        font-weight: 600;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes drift {
        from {
          transform: scale(1.04) translate3d(0, 0, 0);
        }
        to {
          transform: scale(1.08) translate3d(-1.2%, -0.8%, 0);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .hero__media img,
        .hero__content,
        .product__frame {
          animation: none;
        }
      }

      @media (min-width: 900px) {
        .hero {
          align-items: center;
        }

        .hero__content {
          width: min(1100px, calc(100% - 4rem));
          display: grid;
          grid-template-columns: 1.15fr 0.85fr;
          gap: 2rem;
          align-items: center;
          padding: 5rem 0;
        }

        .copy {
          max-width: 34rem;
        }

        .product {
          padding: 0;
          justify-items: end;
        }

        .product__frame {
          width: min(320px, 28vw);
        }

        .foot {
          text-align: left;
          padding-left: max(2rem, calc((100% - 1100px) / 2));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-label="nginery">
        <div class="hero__media" aria-hidden="true">
          <img src="./hero.jpg" alt="" />
        </div>
        <div class="hero__veil" aria-hidden="true"></div>

        <div class="hero__content">
          <div class="copy">
            <p class="brand">nginery</p>
            <h1 class="headline">Shibomo — feel clever through play</h1>
            <p class="support">
              Four puzzle styles on one quiet journey. Built and published by
              nginery.
            </p>
            <div class="actions">
              <a
                class="btn"
                href="https://play.google.com/store/apps/details?id=com.shibomo.app"
                >Get Shibomo on Google Play</a
              >
              <a class="link" href="./privacy-policy.txt">Privacy policy</a>
            </div>
          </div>

          <div class="product">
            <div class="product__frame">
              <img src="./icon.png" width="512" height="512" alt="Shibomo app icon" />
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot">
      <p>
        Contact:
        <a href="mailto:eraysworks@gmail.com">eraysworks@gmail.com</a>
      </p>
    </footer>
  </body>
</html>
